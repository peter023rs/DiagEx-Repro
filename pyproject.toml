[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diagex"
version = "0.1.0"
description = "Evidence-v2 P&ID legend and symbol detection with a read-only local workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Heiko Koziolek", email = "heiko.koziolek@gmail.com" }]
dependencies = [
    "anthropic>=0.125,<0.126",
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27,<1",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.4.0",
]

[project.scripts]
diagex = "diagex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/diagex"]
exclude = ["src/diagex/dexpi/**", "src/diagex/review/**", "src/diagex/workflows/**", "src/diagex/extractors/pid.py", "**/__pycache__/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/diagex/assets/symbols" = "diagex/assets/symbols"

[tool.hatch.build.targets.sdist]
include = ["src/diagex", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["src/diagex/dexpi/**", "src/diagex/review/**", "src/diagex/workflows/**", "src/diagex/extractors/pid.py", "**/__pycache__/**", "tests/unit/test_run_module_seams.py"]

[tool.hatch.build.targets.sdist.force-include]
"src/diagex/assets/symbols" = "src/diagex/assets/symbols"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/diagex/dexpi", "src/diagex/workflows", "eval", "scripts", "paper", "results", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
